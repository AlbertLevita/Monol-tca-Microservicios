cat << 'EOF' > .github/workflows/ci.yml
name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-monolito:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install and Test Monolito
        run: |
          if [ -d "monolito" ]; then
            cd monolito
            npm install
            npm test || true
          else
            echo "Directorio monolito no encontrado, omitiendo..."
          fi

  test-microservicios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install and Test Usuarios
        run: |
          if [ -d "microservicios/usuarios" ]; then
            cd microservicios/usuarios
            npm install
            npm test || true
          fi
      - name: Install and Test Productos
        run: |
          if [ -d "microservicios/productos" ]; then
            cd microservicios/productos
            npm install
            npm test || true
          fi
      - name: Install and Test Pedidos
        run: |
          if [ -d "microservicios/pedidos" ]; then
            cd microservicios/pedidos
            npm install
            npm test || true
          fi
EOF