name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: exit 1

      - name: Check Monolito
        run: |
          if [ -d "monolito" ]; then
            cd monolito
            npm install || true
          fi

      - name: Check Microservicio Usuarios
        run: |
          if [ -d "microservicios/usuarios" ]; then
            cd microservicios/usuarios
            npm install || true
          fi

      - name: Check Microservicio Productos
        run: |
          if [ -d "microservicios/productos" ]; then
            cd microservicios/productos
            npm install || true
          fi

      - name: Check Microservicio Pedidos
        run: |
          if [ -d "microservicios/pedidos" ]; then
            cd microservicios/pedidos
            npm install || true
          fi
