
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: proyecto_app
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: proyecto_app
      DB_USER: app_user
      DB_PASSWORD: app123
    depends_on:
      - db

volumes:
  postgres_data:
